[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spagcn-modern"
version = "1.2.7.post2"
description = "Maintained Python fork of SpaGCN"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Jian Hu", email = "jianhu@pennmedicine.upenn.edu"},
]
maintainers = [
    {name = "Chen Yang", email = "cafferychen777@tamu.edu"},
]
dependencies = [
    "anndata>=0.10",
    "igraph>=0.11.9,<2",
    "matplotlib>=3.7",
    "numba>=0.58",
    "numpy>=1.24",
    "pandas>=1.5",
    "scanpy>=1.10",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "torch>=2.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/cafferychen777/SpaGCN"
Repository = "https://github.com/cafferychen777/SpaGCN"
"Original project" = "https://github.com/jianhuupenn/SpaGCN"
Issues = "https://github.com/cafferychen777/SpaGCN/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["SpaGCN", "SpaGCN.*"]

[tool.ruff.lint]
ignore = ["E741"]
