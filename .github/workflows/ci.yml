name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install test and build tools
        run: python -m pip install . ruff build twine
      - name: Check source
        run: |
          python -m compileall -q src
          ruff check --select E9,F63,F7,F82 src tests
          python -m unittest discover -s tests -v
      - name: Run sparse-data and Leiden smoke tests
        run: |
          python - <<'PY'
          import numpy as np
          from importlib.metadata import PackageNotFoundError, version

          import scanpy as sc
          from scipy import sparse
          import SpaGCN

          try:
              version("louvain")
          except PackageNotFoundError:
              pass
          else:
              raise AssertionError("obsolete louvain distribution was installed")

          rng = np.random.default_rng(42)
          image = np.ones((8, 8, 3), dtype=float)
          histology_adjacency = SpaGCN.calculate_adj_matrix(
              [0, 1],
              [0, 1],
              x_pixel=[2, 5],
              y_pixel=[2, 5],
              image=image,
              beta=3,
          )
          assert np.isfinite(histology_adjacency).all()

          adata = sc.AnnData(sparse.csr_matrix(rng.random((30, 12))))
          coordinates = np.column_stack((np.arange(30), np.zeros(30)))
          adjacency = np.linalg.norm(
              coordinates[:, None, :] - coordinates[None, :, :], axis=2
          )
          model = SpaGCN.SpaGCN()
          model.set_l(1.0)
          model.train(
              adata,
              adjacency,
              num_pcs=5,
              max_epochs=2,
              n_neighbors=5,
              res=0.5,
          )
          labels, probabilities = model.predict()
          assert labels.shape == (30,)
          assert probabilities.shape[0] == 30
          PY
      - name: Build and verify distributions
        run: |
          python -m build
          python -m twine check dist/*
